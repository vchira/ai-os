[workspace]
resolver = "2"
members = [
    "aios-core",
    "aios-llm",
    "aios-voice",
    "aios-tools",
    "aios-gtk",
    "aios-web",
    "aios-signal",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "BUSL-1.1"
license-file = "LICENSE"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
async-trait = "0.1"
directories = "6.0"
regex = "1"
tempfile = "3"
cpal = "0.15"
hound = "3.5"
rubato = "0.15"
ort = { version = "2.0.0-rc.9", features = ["load-dynamic"] }
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }

gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_2"] }

aios-core = { path = "aios-core" }
aios-voice = { path = "aios-voice" }
aios-llm = { path = "aios-llm" }
aios-tools = { path = "aios-tools" }
aios-web = { path = "aios-web" }
aios-signal = { path = "aios-signal" }

[profile.release]
lto = false
strip = "symbols"
