<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">AiOS Workspace — Crate Dependencies</text>

  <!-- aios-gtk (binary) -->
  <rect x="325" y="70" width="250" height="60" rx="10" fill="#1a3a5c" stroke="#4a9eff" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="97" text-anchor="middle" fill="#4a9eff" font-size="16" font-weight="bold">aios-gtk</text>
  <text x="450" y="117" text-anchor="middle" fill="#8b949e" font-size="11">Binary: aios | GTK4 Desktop App</text>

  <!-- aios-llm -->
  <rect x="50" y="200" width="200" height="55" rx="8" fill="#1a2d1a" stroke="#2ed573" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="225" text-anchor="middle" fill="#2ed573" font-size="14" font-weight="bold">aios-llm</text>
  <text x="150" y="243" text-anchor="middle" fill="#8b949e" font-size="10">Claude + OpenAI APIs</text>

  <!-- aios-tools -->
  <rect x="270" y="200" width="200" height="55" rx="8" fill="#2d1a1a" stroke="#ff6348" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="225" text-anchor="middle" fill="#ff6348" font-size="14" font-weight="bold">aios-tools</text>
  <text x="370" y="243" text-anchor="middle" fill="#8b949e" font-size="10">12 Built-in Tools + Registry</text>

  <!-- aios-voice -->
  <rect x="490" y="200" width="200" height="55" rx="8" fill="#2d2d1a" stroke="#ffa502" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="225" text-anchor="middle" fill="#ffa502" font-size="14" font-weight="bold">aios-voice</text>
  <text x="590" y="243" text-anchor="middle" fill="#8b949e" font-size="10">STT + TTS + Wake Word</text>

  <!-- aios-web -->
  <rect x="130" y="320" width="180" height="55" rx="8" fill="#1a1a2d" stroke="#a29bfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="345" text-anchor="middle" fill="#a29bfe" font-size="14" font-weight="bold">aios-web</text>
  <text x="220" y="363" text-anchor="middle" fill="#8b949e" font-size="10">Axum HTTP + WebSocket</text>

  <!-- aios-signal -->
  <rect x="590" y="320" width="180" height="55" rx="8" fill="#2d1a2d" stroke="#fd79a8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="345" text-anchor="middle" fill="#fd79a8" font-size="14" font-weight="bold">aios-signal</text>
  <text x="680" y="363" text-anchor="middle" fill="#8b949e" font-size="10">Signal Messenger (signal-cli)</text>

  <!-- aios-core -->
  <rect x="250" y="460" width="400" height="70" rx="10" fill="#1a1a1a" stroke="#e6edf3" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="490" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">aios-core</text>
  <text x="450" y="512" text-anchor="middle" fill="#8b949e" font-size="11">Types | Config | Channels | Vault | Memory | i18n</text>

  <!-- Arrows: gtk → subsystems -->
  <line x1="380" y1="130" x2="170" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="130" x2="370" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="130" x2="570" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="130" x2="230" y2="320" stroke="#666" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <line x1="530" y1="130" x2="670" y2="320" stroke="#666" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Arrows: subsystems → core -->
  <line x1="150" y1="255" x2="350" y2="460" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="370" y1="255" x2="420" y2="460" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="590" y1="255" x2="550" y2="460" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="375" x2="380" y2="460" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="680" y1="375" x2="550" y2="460" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="570" width="840" height="60" rx="8" fill="#161b22"/>
  <line x1="50" y1="600" x2="90" y2="600" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="605" fill="#8b949e" font-size="11">depends on</text>
  <line x1="220" y1="600" x2="260" y2="600" stroke="#666" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="270" y="605" fill="#8b949e" font-size="11">channel integration</text>
  <rect x="450" y="590" width="16" height="16" rx="3" fill="#1a3a5c" stroke="#4a9eff" stroke-width="1"/>
  <text x="475" y="603" fill="#8b949e" font-size="11">binary</text>
  <rect x="550" y="590" width="16" height="16" rx="3" fill="#1a1a1a" stroke="#e6edf3" stroke-width="1"/>
  <text x="575" y="603" fill="#8b949e" font-size="11">foundational lib</text>
  <rect x="700" y="590" width="16" height="16" rx="3" fill="#1a2d1a" stroke="#2ed573" stroke-width="1"/>
  <text x="725" y="603" fill="#8b949e" font-size="11">subsystem libs</text>
</svg>
