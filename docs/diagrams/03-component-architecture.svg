<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <rect width="1100" height="800" fill="#0d1117" rx="12"/>
  <text x="550" y="35" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="bold">AiOS Component Architecture</text>

  <!-- ═══ HUMAN LAYER ═══ -->
  <rect x="30" y="55" width="1040" height="60" rx="10" fill="#1a3a5c" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="550" y="80" text-anchor="middle" fill="#4a9eff" font-size="14" font-weight="bold">HUMAN</text>
  <text x="200" y="100" text-anchor="middle" fill="#8b949e" font-size="11">🎤 Voice</text>
  <text x="400" y="100" text-anchor="middle" fill="#8b949e" font-size="11">⌨️ Text Prompt</text>
  <text x="600" y="100" text-anchor="middle" fill="#8b949e" font-size="11">🌐 Web Browser</text>
  <text x="800" y="100" text-anchor="middle" fill="#8b949e" font-size="11">📱 Signal</text>

  <!-- ═══ CHANNEL LAYER ═══ -->
  <rect x="30" y="130" width="1040" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="70" y="150" fill="#e6edf3" font-size="13" font-weight="bold">Channels</text>

  <rect x="50" y="160" width="180" height="45" rx="6" fill="#1a2d1a" stroke="#2ed573" stroke-width="1"/>
  <text x="140" y="180" text-anchor="middle" fill="#2ed573" font-size="12" font-weight="bold">Desktop (GTK4)</text>
  <text x="140" y="195" text-anchor="middle" fill="#6e7681" font-size="9">Full: panels, images, md</text>

  <rect x="250" y="160" width="180" height="45" rx="6" fill="#1a2d1a" stroke="#2ed573" stroke-width="1"/>
  <text x="340" y="180" text-anchor="middle" fill="#2ed573" font-size="12" font-weight="bold">Voice</text>
  <text x="340" y="195" text-anchor="middle" fill="#6e7681" font-size="9">Wake → STT → TTS</text>

  <rect x="450" y="160" width="180" height="45" rx="6" fill="#1a1a2d" stroke="#a29bfe" stroke-width="1"/>
  <text x="540" y="180" text-anchor="middle" fill="#a29bfe" font-size="12" font-weight="bold">Web (axum)</text>
  <text x="540" y="195" text-anchor="middle" fill="#6e7681" font-size="9">WebSocket, aios.local</text>

  <rect x="650" y="160" width="180" height="45" rx="6" fill="#2d1a2d" stroke="#fd79a8" stroke-width="1"/>
  <text x="740" y="180" text-anchor="middle" fill="#fd79a8" font-size="12" font-weight="bold">Signal (signal-cli)</text>
  <text x="740" y="195" text-anchor="middle" fill="#6e7681" font-size="9">Text only, 4096 chars</text>

  <rect x="850" y="160" width="200" height="45" rx="6" fill="#1a1a1a" stroke="#6e7681" stroke-width="1"/>
