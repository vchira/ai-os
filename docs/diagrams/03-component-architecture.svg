  <rect x="580" y="610" width="90" height="35" rx="4" fill="#1a1a1a" stroke="#e6edf3" stroke-width="1"/>
  <text x="625" y="632" text-anchor="middle" fill="#e6edf3" font-size="10">i18n</text>

  <rect x="680" y="610" width="90" height="35" rx="4" fill="#1a1a1a" stroke="#e6edf3" stroke-width="1"/>
